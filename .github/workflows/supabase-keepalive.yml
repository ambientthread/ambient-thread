# Daily database keep-alive.
#
# Supabase pauses a FREE-plan project after a quiet week, and a paused project
# means the contact form and /admin stop working. This site is a static export
# (no server routes, so no Vercel cron), so GitHub runs one tiny read a day.
#
# The key below is the PUBLISHABLE key, which is already public in the site's
# source. The leads table denies anonymous reads, so Postgres answers 401
# "permission denied", but it is still a real database request, which is what
# counts. Only no answer or a 5xx (paused or down) fails the job.
#
# Note: GitHub turns off scheduled workflows in public repos after 60 days with
# no commits. It emails the repo owner first; "Enable workflow" in the Actions
# tab turns it back on.

name: Supabase keep-alive

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Read one row
        env:
          SUPABASE_URL: https://iorqovbeunehkvejcquc.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_ZLEqxC3sYSKRho_M_tih_A_IJG-JFeH
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            "$SUPABASE_URL/rest/v1/leads?select=id&limit=1")
          echo "Supabase responded $status"
          case "$status" in 200|401|403) ;; *) exit 1 ;; esac
